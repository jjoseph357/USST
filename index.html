<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USST Avionics Master Schedule</title>
  <meta name="description" content="USST Rocketry Avionics Master Schedule, Gantt Timeline, and Google Sheets Sync." />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand-section">
      <span class="brand-tag">USST</span>
      <div class="brand-info">
        <span class="brand-title">Avionics Master Schedule</span>
        <span class="brand-meta">Launch Canada 2027</span>
      </div>
    </div>

    <nav class="nav-tabs" aria-label="Main Navigation">
      <button class="tab-btn active" id="tab-gantt" data-view="gantt">Gantt Timeline</button>
      <button class="tab-btn" id="tab-calendar" data-view="calendar">Monthly Calendar</button>
      <button class="tab-btn" id="tab-backlog" data-view="backlog">Technical Backlog &amp; Sizing</button>
    </nav>

    <div class="header-actions">
      <div class="sync-status-indicator" id="sync-status-badge">
        <span class="status-dot" id="sync-status-dot"></span>
        <span id="sync-status-text">Local Baseline</span>
      </div>
      <button class="btn btn-default" id="btn-refresh-sheet" title="Fetch latest updates from Google Sheets">
        Refresh
      </button>
      <button class="btn btn-default" id="btn-open-setup">
        Connect Sheet
      </button>
    </div>
  </header>

  <div class="read-only-banner">
    <span>
      <strong>Controlled by Google Sheets:</strong> To change dates, dependencies, or scope, edit your team's Google Sheet.
    </span>
    <button id="btn-banner-guide">Google Sheets Setup Instructions</button>
  </div>

  <aside class="sub-toolbar" aria-label="Filters and Controls">
    <div class="filter-group">
      <span class="filter-heading">Filters</span>
      <label class="filter-chip cat-hw">
        <input type="checkbox" id="filter-hw" checked />
        <span>Avionics Hardware</span>
      </label>
      <label class="filter-chip cat-sw">
        <input type="checkbox" id="filter-sw" checked />
        <span>Avionics Software</span>
      </label>
      <label class="filter-chip cat-milestone">
        <input type="checkbox" id="filter-milestone" checked />
        <span>Milestones &amp; Reviews</span>
      </label>
      <label class="filter-chip cat-university">
        <input type="checkbox" id="filter-university" checked />
        <span>University Dates</span>
      </label>
    </div>

    <div class="zoom-group" id="gantt-zoom-controls">
      <button class="zoom-btn" data-zoom="day">Day</button>
      <button class="zoom-btn active" data-zoom="week">Week</button>
      <button class="zoom-btn" data-zoom="month">Month</button>
    </div>
  </aside>

  <main class="main-container">
    <section class="view-section active" id="view-gantt" aria-label="Gantt Timeline View">
      <div class="gantt-wrapper" id="gantt-container"></div>
    </section>

    <section class="view-section" id="view-calendar" aria-label="Calendar View">
      <div id="calendar-container"></div>
    </section>

    <section class="view-section" id="view-backlog" aria-label="Technical Backlog &amp; Capacity View">
      <div id="backlog-container"></div>
    </section>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
